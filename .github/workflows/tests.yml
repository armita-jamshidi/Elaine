name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is what Anki desktop ships; 3.10 is the oldest the launcher allows.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Qt (bundled with Anki) renders SVG flags; install it so that test runs too.
      - run: sudo apt-get install -y libegl1
      - run: pip install -r requirements-dev.txt PyQt6
      - run: pytest -v
        env:
          QT_QPA_PLATFORM: offscreen
      # Build the installable add-on and attach it to the run (Actions > run > Artifacts).
      - run: python scripts/package.py
        if: matrix.python-version == '3.13'
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: flag-mnemonics-ankiaddon
          path: dist/*.ankiaddon
